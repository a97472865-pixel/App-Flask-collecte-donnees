<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collecte de données</title>
    <style>
	@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

	@import url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css");


	*{
	    margin:0;
	    padding:0;
	    box-sizing:border-box;
	}

	/* ==========================================
	   BODY
	========================================== */
	body{
	    font-family:'Inter', sans-serif;
	    min-height:100vh;
	    display:flex;
	    justify-content:center;
	    align-items:center;
	    background:
		radial-gradient(circle at top left, #5b86e5 0%, transparent 30%),
		radial-gradient(circle at bottom right, #36d1dc 0%, transparent 30%),
		linear-gradient(135deg, #0f172a, #111827, #1e293b);
	    position:relative;
	    padding:20px;
	}

	/* Cercles décoratifs */
	body::before,
	body::after{
	    content:"";
	    position:absolute;
	    width:300px;
	    height:300px;
	    border-radius:50%;
	    background:rgba(255,255,255,0.05);
	    filter:blur(10px);
	}

	body::before{
	    top:0px;
	    left:0px;
	}

	body::after{
	    bottom:0px;
	    right:0px;
	}

	/* ==========================================
	   FORMULAIRE
	========================================== */
	form{
	    width:100%;
	    max-width:520px;
	    height: 70%;
	    padding:45px;
	    border-radius:30px;
	    background:rgba(255,255,255,0.08);
	    backdrop-filter:blur(18px);
	    border:1px solid rgba(255,255,255,0.12);
	    box-shadow:
		0 10px 40px rgba(0,0,0,0.35),
		inset 0 0 1px rgba(255,255,255,0.25);
	    animation:fadeIn 1s ease;
	    position:relative;
	    z-index:1;
	}

	/* ==========================================
	   TITRE
	========================================== */
	h2{
	    position:absolute;
	    top:40px;
	    right: 5%;
	    text-align:right;
	    width:40%;
	    color:white;
	    font-size:1.0rem;
	    font-weight:700;
	    letter-spacing:1px;
	    text-shadow:0 5px 20px rgba(0,0,0,0.3);
	}

	/* ==========================================
	   LABELS
	========================================== */
	form{
	    color:white;
	    font-size:0.95rem;
	    font-weight:500;
	}

	/* ==========================================
	   INPUTS & SELECT
	========================================== */
	input,
	select{
	    width:100%;
	    padding:16px;
	    margin-top:8px;
	    margin-bottom:18px;
	    border:none;
	    border-radius:16px;
	    background:rgba(255,255,255,0.09);
	    color:white;
	    font-size:1rem;
	    outline:none;
	    transition:0.35s ease;
	    border:1px solid rgba(255,255,255,0.08);
	}

	/* Placeholder */
	input::placeholder{
	    color:rgba(255,255,255,0.6);
	}

	/* Focus */
	input:focus,
	select:focus{
	    transform:translateY(-2px);
	    background:rgba(255,255,255,0.14);
	    border:1px solid #4facfe;
	    box-shadow:
		0 0 0 4px rgba(79,172,254,0.15),
		0 8px 20px rgba(0,0,0,0.2);
	}

	/* Select options */
	select option{
	    color:black;
	}

	/* ==========================================
	   BOUTON
	========================================== */
	button{
	    width:100%;
	    padding:16px;
	    border:none;
	    border-radius:18px;
	    background:linear-gradient(135deg,#4facfe,#00f2fe);
	    color:white;
	    font-size:1rem;
	    font-weight:600;
	    letter-spacing:1px;
	    cursor:pointer;
	    transition:0.35s ease;
	    margin-top:10px;
	    box-shadow:0 8px 25px rgba(79,172,254,0.35);
	}

	/* Hover */
	button:hover{
	    transform:translateY(-4px) scale(1.02);
	    box-shadow:
		0 12px 30px rgba(0,242,254,0.35),
		0 0 18px rgba(79,172,254,0.4);
	}

	/* Click */
	button:active{
	    transform:scale(0.98);
	}

	/* ==========================================
	   LIENS
	========================================== */
	a{
	    display:block;
	    text-align:center;
	    margin-top:18px;
	    margin: 18px;
	    color:#dbeafe;
	    text-decoration:none;
	    font-weight:500;
	    transition:0.3s ease;
	}

	a:hover{
	    color:#0f172a;
	    padding: 1%;
	    background-color: #dbeafe;
	    border-radius: 20px;
	    transform:translateY(-2px);
	}

	/* ==========================================
	   ANIMATION
	========================================== */
	@keyframes fadeIn{
	    from{
		opacity:0;
		transform:translateY(40px);
	    }

	    to{
		opacity:1;
		transform:translateY(0);
	    }
	}

	/* ==========================================
	   RESPONSIVE
	========================================== */
	@media(max-width:650px){

	    form{
		padding:30px 22px;
		border-radius:24px;
	    }

	    h2{
		font-size:1rem;
		top:20px;
	    }

	    input,
	    select{
		padding:14px;
	    }

	    button{
		padding:14px;
	    }
	}
	</style>

</head>
<body>
    <h2><i class="bi bi-bar-chart-fill"></i> Bienvenue sur notre plateforme de collecte de données</h2>

    <form action="/submit" method="post">
        Age: <input type="number" name="age"><br><br>

        Sexe:
        <select name="sexe">
            <option>Homme</option>
            <option>Femme</option>
        </select><br><br>

        Université: <input type="text" name="universite"><br><br>

        Budget Internet Mensuel: <input type="number" name="budget"><br><br>

        Temps journalier en ligne: <input type="number" name="temps"><br><br>

        Opérateur: 
        <select name="operateur">
        	<option>MTN</option>
        	<option>Orange</option>
        	<option>Nexttel</option>
        	<option>Camtel</option>
        	<option>Autre</option>
        </select><br><br>

        Usage:
        <select name="usage">
            <option>Etudes</option>
            <option>Divertissement</option>
            <option>Business</option>
            <option>Autre</option>
        </select><br><br>

        <button type="submit">Envoyer</button>
    </form>

    <br>
    <a href="/export">Exporter les données</a>
    <br>
    <a href="/show-analysis">Voir l'analyse</a>
    <br>
    <a href="/download-analysis">Telecharger l'analyse</a>
</body>
</html>
